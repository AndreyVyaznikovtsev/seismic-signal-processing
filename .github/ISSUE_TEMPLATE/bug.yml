name: Ошибка
description: Что-то считает или собирается неправильно
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: Что происходит
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Что должно происходить
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Как воспроизвести
      description: Минимальный пример кода или шаги
      render: python
    validations:
      required: true
